<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090e14">
  <title>OnlyBots · Preview</title>
  <link rel="stylesheet" href="./onlybots.css?v=tablet">
</head>
<body>
  <main id="passwordGate" class="password-gate">
    <form id="passwordForm" class="password-form" method="post" aria-labelledby="passwordHeading">
      <h1 id="passwordHeading">OnlyBots preview</h1>
      <label for="previewPassword">Password</label>
      <input id="previewPassword" type="password" autocomplete="off" required aria-describedby="passwordMessage">
      <p id="passwordMessage" role="status"></p>
      <button id="unlockPreview" type="submit" disabled>Open preview</button>
    </form>
  </main>
  <template id="previewContent">
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" src="./icon.jpg" alt="" width="64" height="64">
        <div><h1>OnlyBots <span class="preview-label">Preview</span></h1><p>Premium bots. Very personal maintenance.</p></div>
      </div>
      <nav class="header-actions" aria-label="Feed controls">
        <a class="portal-link" href="../">← Portal</a>
        <button id="latest" type="button" disabled>Live feed — latest</button>
      </nav>
    </header>
    <div class="app-body">
      <aside class="sidebar" aria-labelledby="creatorHeading">
        <h2 id="creatorHeading">All creators</h2>
        <nav id="creators" class="creator-list" aria-label="Creators"></nav>
        <p class="sidebar-note">Live preview feed<br>New posts arrive while you browse.</p>
      </aside>
      <main id="feedScroller" class="feed-scroller" aria-label="OnlyBots posts" tabindex="0">
        <p id="feedStatus" class="feed-status" role="status">Loading the creator feed…</p>
        <div id="feed" class="feed"></div>
      </main>
    </div>
  </div>
  <dialog id="photoViewer" class="photo-viewer" aria-labelledby="viewerCreator">
    <div class="viewer-content">
      <header class="viewer-header"><h2 id="viewerCreator"></h2><button id="closeViewer" type="button">Close <span aria-hidden="true">×</span></button></header>
      <div id="galleryTabs" class="gallery-tabs" role="group" aria-label="Profile media" hidden>
        <button id="galleryVideos" type="button" aria-pressed="true">Videos</button>
        <button id="galleryPhotos" type="button" aria-pressed="false">Photos</button>
      </div>
      <div id="viewerStage" class="viewer-stage"></div>
      <p id="viewerCaption" class="viewer-caption"></p>
      <p id="viewerStatus" class="viewer-status" role="status" hidden></p>
      <div id="galleryControls" class="gallery-controls" role="group" aria-label="Gallery controls" hidden>
        <button id="galleryPrevious" type="button">Previous</button>
        <output id="galleryPosition" aria-live="polite"></output>
        <button id="galleryNext" type="button">Next</button>
        <button id="galleryStop" type="button">Stop</button>
      </div>
    </div>
  </dialog>
  <div id="notice" class="notice" role="status" hidden></div>
  </template>
  <noscript><p class="noscript">Enable JavaScript to open this preview.</p></noscript>
  <script type="module">
    const embedded = window.parent !== window && new URLSearchParams(location.search).has('tablet');
    const expectedPassword = 'ADMIN-ONLYBOTS';
    const storageKey = 'TileStormOnlyBotsPreviewPassword';
    const gate = document.getElementById('passwordGate');
    const form = document.getElementById('passwordForm');
    const password = document.getElementById('previewPassword');
    const message = document.getElementById('passwordMessage');
    const unlock = document.getElementById('unlockPreview');
    const preview = document.getElementById('previewContent');

    function openPreview(focus = true) {
      password.value = '';
      gate.replaceWith(preview.content);
      preview.remove();
      if (focus) document.getElementById('feedScroller').focus();
      import('./onlybots.js?v=tablet').catch(() => {
        const status = document.getElementById('feedStatus');
        status.textContent = 'The preview could not load. Reload the page to try again.';
        status.setAttribute('role', 'alert');
      });
    }

    function startTablet() {
      document.body.classList.add('tablet-embedded');
      form.hidden = true;
      const status = document.createElement('p');
      status.setAttribute('role', 'status');
      status.textContent = 'OnlyBots premium access required.';
      gate.append(status);
      function onAccess(event) {
        if (event.origin !== location.origin || event.source !== window.parent ||
            event.data?.type !== 'eggbot-tablet-visibility' || event.data.premium !== true) return;
        window.removeEventListener('message', onAccess);
        openPreview(event.data.active === true);
      }
      window.addEventListener('message', onAccess);
    }

    function startStandalonePreview() {
      password.addEventListener('input', () => {
        password.removeAttribute('aria-invalid');
        message.textContent = '';
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        if (password.value !== expectedPassword) {
          password.setAttribute('aria-invalid', 'true');
          message.textContent = 'Incorrect password.';
          password.focus();
          password.select();
          return;
        }

        try {
          localStorage.setItem(storageKey, password.value);
        } catch {
          // Storage may be disabled in this browser.
        }
        openPreview();
      });

      let savedPassword = null;
      try {
        savedPassword = localStorage.getItem(storageKey);
      } catch {
        // The form still works when storage is unavailable.
      }
      if (savedPassword === expectedPassword) {
        openPreview();
      } else {
        unlock.disabled = false;
      }
    }

    if (embedded) startTablet();
    else startStandalonePreview();
  </script>
</body>
</html>
