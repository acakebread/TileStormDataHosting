<!doctype html>
<!-- Copyright 2026 massivehadron.com ltd. -->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090e14">
  <title>OnlyBots · Preview</title>
  <link rel="stylesheet" href="./onlybots.css?v=onlybots-shop">
</head>
<body>
  <main id="accessGate" class="access-gate">
    <p role="status">Loading OnlyBots…</p>
  </main>
  <template id="purchaseFormTemplate">
    <form class="purchase-form" method="post">
      <p class="purchase-instructions">Access unlocks automatically after payment. You can also use an existing code.</p>
      <label>Purchase code
        <input type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" aria-describedby="purchaseStatus" required>
      </label>
      <p id="purchaseStatus" class="purchase-status" role="status"></p>
      <div class="purchase-actions">
        <button class="shop-link" type="button"></button>
        <button class="purchase-unlock" type="submit">Unlock</button>
      </div>
    </form>
  </template>
  <template id="previewContent">
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" src="./icon.jpg" alt="" width="64" height="64">
        <div><h1>OnlyBots <span class="preview-label">Preview</span></h1><p>Premium bots. Very personal maintenance.</p></div>
      </div>
      <nav class="header-actions" aria-label="Feed controls">
        <a class="portal-link" href="../">← Portal</a>
        <button id="latest" type="button" disabled>Live feed — latest</button>
      </nav>
    </header>
    <div class="app-body">
      <aside class="sidebar" aria-labelledby="creatorHeading">
        <h2 id="creatorHeading">All creators</h2>
        <nav id="creators" class="creator-list" aria-label="Creators"></nav>
        <p class="sidebar-note">Live preview feed<br>New posts arrive while you browse.</p>
      </aside>
      <main id="feedScroller" class="feed-scroller" aria-label="OnlyBots posts" tabindex="0">
        <p id="feedStatus" class="feed-status" role="status">Loading the creator feed…</p>
        <div id="feed" class="feed"></div>
      </main>
    </div>
  </div>
  <dialog id="photoViewer" class="photo-viewer" aria-labelledby="viewerCreator">
    <div class="viewer-content">
      <header class="viewer-header"><h2 id="viewerCreator"></h2><button id="closeViewer" type="button">Close <span aria-hidden="true">×</span></button></header>
      <div id="galleryTabs" class="gallery-tabs" role="group" aria-label="Profile media" hidden>
        <button id="galleryVideos" type="button" aria-pressed="true">Videos</button>
        <button id="galleryPhotos" type="button" aria-pressed="false">Photos</button>
      </div>
      <div id="viewerStage" class="viewer-stage"></div>
      <p id="viewerCaption" class="viewer-caption"></p>
      <p id="viewerStatus" class="viewer-status" role="status" hidden></p>
      <div id="galleryControls" class="gallery-controls" role="group" aria-label="Gallery controls" hidden>
        <button id="galleryPrevious" type="button">Previous</button>
        <output id="galleryPosition" aria-live="polite"></output>
        <button id="galleryNext" type="button">Next</button>
        <button id="galleryStop" type="button">Stop</button>
      </div>
    </div>
  </dialog>
  <dialog id="profilePurchase" class="profile-purchase" aria-labelledby="profilePurchaseHeading">
    <h2 id="profilePurchaseHeading"></h2>
  </dialog>
  <div id="notice" class="notice" role="status" hidden></div>
  </template>
  <noscript><p class="noscript">Enable JavaScript to open this preview.</p></noscript>
  <script type="module" src="./access.js?v=automatic-unlock"></script>
</body>
</html>
