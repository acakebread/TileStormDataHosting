<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PixelStow browser checks</title>
<style>
  body { margin: 20px; font: 16px/1.5 system-ui; background: #081016; color: #f2f6fb; }
  button { padding: 10px 18px; } iframe { width: 100%; height: 1100px; border: 1px solid #52687a; }
</style>
<h1>PixelStow browser checks</h1>
<p>Tests use public generated files and a synthetic audio tone. No microphone is accessed.</p>
<button id="run">Run browser checks</button>
<pre id="results" role="status">Ready.</pre>
<iframe id="app" src="../pixelstow.html" title="PixelStow under test"></iframe>
<script>
  const frame = document.querySelector("#app");
  const results = document.querySelector("#results");
  const run = document.querySelector("#run");
  function check(condition, label) {
    if (!condition) throw new Error(label);
    results.textContent += "PASS: " + label + "\n";
  }
  async function until(condition, label, timeout = 30000) {
    const started = performance.now();
    while (!condition()) {
      if (performance.now() - started > timeout) throw new Error("Timed out: " + label);
      await new Promise((resolve) => setTimeout(resolve, 30));
    }
  }
  run.addEventListener("click", async () => {
    run.disabled = true;
    results.textContent = "Running…\n";
    let audioContext;
    let restoreDownloads;
    try {
      const app = frame.contentWindow, doc = frame.contentDocument;
      await until(() => app.PixelStow && app.PixelStowMediaPanel && app.PixelStowExportDialog, "app loaded");
      const element = (id) => doc.querySelector("#" + id);
      const input = (id, value) => {
        element(id).value = value;
        element(id).dispatchEvent(new app.Event("input", { bubbles: true }));
      };
      const files = (id, items) => {
        const transfer = new app.DataTransfer();
        for (const item of items) transfer.items.add(item);
        element(id).files = transfer.files;
        element(id).dispatchEvent(new app.Event("change", { bubbles: true }));
      };
      const downloads = [];
      const anchorClick = app.HTMLAnchorElement.prototype.click;
      restoreDownloads = () => { app.HTMLAnchorElement.prototype.click = anchorClick; };
      app.HTMLAnchorElement.prototype.click = function () {
        if (!this.hasAttribute("data-pixelstow-export")) return anchorClick.call(this);
        downloads.push({ name: this.download, bytes: fetch(this.href).then((response) => response.arrayBuffer()) });
      };
      const openExport = async (control) => {
        control.dispatchEvent(new app.MouseEvent("click", { bubbles: true, cancelable: true }));
        await until(() => element("export-dialog").open, "export filename dialog");
      };
      const saveExport = async (name) => {
        const before = downloads.length;
        input("export-name", name);
        element("export-form").requestSubmit();
        await until(() => downloads.length > before && !element("decode").disabled, "export completed");
        return { name: downloads.at(-1).name, bytes: new app.Uint8Array(await downloads.at(-1).bytes) };
      };
      const width = 1000, height = 800;
      const pixels = new app.Uint8Array(width * height * 4);
      for (let i = 0; i < pixels.length; i += 4) pixels.set([140, 140, 140, 255], i);
      const clean = new app.File([await app.PixelStow.writePng(pixels, width, height)], "public-photo.png", { type: "image/png" });
      files("file", [clean]);
      await until(() => !element("encode").disabled, "clean image import");
      check(!element("attachment-file").disabled, "Clean image enables attachment input");
      check(element("loaded-image").textContent === "Loaded file: public-photo.png", "The loaded image's filename is shown beside the image picker");
      check(!element("encoding-passwords").hidden && element("unlock-form").hidden, "Encoding offers a password and confirmation without an unlock prompt");
      const viewport = element("viewport"), canvas = element("preview-encoded");
      const captureMethods = [viewport.setPointerCapture, viewport.hasPointerCapture, viewport.releasePointerCapture];
      let captured = false;
      // Synthetic pointer sequences let us exercise both browser event orders,
      // including a contextmenu sent in a later task after capture is released.
      viewport.setPointerCapture = () => { captured = true; };
      viewport.hasPointerCapture = () => captured;
      viewport.releasePointerCapture = () => { captured = false; };
      const pointer = (target, name, button = 2, x = 100) => target.dispatchEvent(new app.PointerEvent(name, {
        bubbles: true, cancelable: true, pointerId: 1, pointerType: "mouse", button,
        buttons: name === "pointerup" ? 0 : button === 2 ? 2 : 1, clientX: x, clientY: 100
      }));
      const menu = (target) => target.dispatchEvent(new app.MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2 }));
      try {
        pointer(canvas, "pointerdown");
        check(!menu(canvas), "Image context menu is blocked when sent on right-button press");
        pointer(viewport, "pointermove", 2, 140);
        check(viewport.classList.contains("panning"), "Right-button movement retains the image pan gesture");
        doc.body.dispatchEvent(new app.KeyboardEvent("keydown", { bubbles: true, key: "Control" }));
        check(!menu(doc.body), "Pressing a modifier while panning cannot enable the release context menu");
        pointer(viewport, "pointerup");
        await new Promise((resolve) => setTimeout(resolve, 30));
        check(!menu(canvas) && !viewport.classList.contains("panning"), "Delayed right-button release over the image cannot open a context menu");
        check(!menu(doc.body), "A pan released outside the image also suppresses its context menu");
        pointer(doc.body, "pointerdown"); pointer(doc.body, "pointerup");
        check(menu(doc.body), "A new right click outside the image keeps the normal page context menu");
        pointer(canvas, "pointerdown"); pointer(viewport, "pointercancel");
        await new Promise((resolve) => setTimeout(resolve, 30));
        check(!menu(doc.body) && !viewport.classList.contains("panning"), "Cancelled pan retains release-menu suppression and clears the pan cursor");
        doc.body.dispatchEvent(new app.KeyboardEvent("keydown", { bubbles: true, key: "ContextMenu" }));
        check(menu(doc.body), "Keyboard context menus outside the image remain available");
        pointer(canvas, "pointerdown", 0); pointer(viewport, "pointerup", 0);
        check(!viewport.classList.contains("panning"), "Left-button image interaction does not start a pan");
        check(!menu(canvas), "Context menus over the image are suppressed independently of pan event timing");
        pointer(canvas, "pointerdown"); captured = false;
        viewport.dispatchEvent(new app.PointerEvent("lostpointercapture", { bubbles: true, pointerId: 1 }));
        check(!viewport.classList.contains("panning") && !menu(doc.body), "Lost pointer capture clears the pan cursor while retaining release-menu suppression");
        pointer(doc.body, "pointerdown", 0); pointer(doc.body, "pointerup", 0);
      } finally {
        [viewport.setPointerCapture, viewport.hasPointerCapture, viewport.releasePointerCapture] = captureMethods;
      }
      const binary = new app.Uint8Array(Array.from({ length: 256 }, (_, i) => i));
      files("attachment-file", [new app.File([binary], "public-🎂.bin"), new app.File([], "empty.txt", { type: "text/plain" })]);
      await until(() => element("attachment-list").children.length === 2 && !element("encode").disabled, "attachment import");
      input("message", "Happy birthday! café 🎂\n  ");
      const publicPassword = "Public browser test key 🎂";
      input("password", publicPassword); input("confirm", "mismatched public test value");
      element("encode").click();
      check(element("status").textContent.includes("do not match") && element("download").hidden, "Encoding still rejects a mismatched confirmation before writing an image");
      input("confirm", publicPassword);
      // Exercise the real browser MediaRecorder using an oscillator stream instead of a device.
      audioContext = new app.AudioContext();
      await audioContext.resume();
      const oscillator = audioContext.createOscillator();
      const destination = audioContext.createMediaStreamDestination();
      oscillator.frequency.value = 440;
      oscillator.connect(destination); oscillator.start();
      Object.defineProperty(app.navigator.mediaDevices, "getUserMedia", {
        configurable: true, value: async () => destination.stream
      });
      element("record-audio").click();
      await until(() => !element("stop-audio").hidden, "recording start");
      check(element("encode").disabled && element("file").disabled, "Recording freezes encode and import controls");
      await new Promise((resolve) => setTimeout(resolve, 900));
      element("stop-audio").click();
      await until(() => element("attachment-list").children.length === 3 && !element("encode").disabled, "recording attached");
      check(destination.stream.getTracks().every((track) => track.readyState === "ended"), "Stopping recording releases every audio track");
      check(element("attachment-list").querySelector("audio"), "Recorded audio has a preview player");
      await until(() => element("attachment-list").querySelector("audio").readyState >= 1, "recorded audio metadata");
      check(!element("attachment-list").querySelector("audio").error, "The browser can read its recorded audio format");
      oscillator.stop(); await audioContext.close(); audioContext = null;
      element("encode").click();
      await until(() => !element("download").hidden && !element("decode").disabled, "encoded PNG download");
      check(!element("password").value && !element("confirm").value, "Successful encoding clears passwords");
      check(element("decoded-attachments").children.length === 3, "Encoding verifies and displays all recovered files");
      check(!element("decoded-content").hidden && element("contents-summary").textContent.includes("a message and 3 attached files (1 audio file)"), "The contents summary identifies the message, file count and audio");
      const encodedPng = await (await fetch(element("download").href)).blob();
      const decodedPng = await app.PixelStow.decodePng(new app.Uint8Array(await encodedPng.arrayBuffer()));
      const payload = await app.PixelStow.decode(decodedPng.pixels, width, height, publicPassword);
      check(payload.status === "success" && payload.attachments.length === 3 && payload.attachments[0].bytes.every((byte, i) => byte === i), "Downloaded PNG preserves binary and real recorded audio bytes");
      check(!element("save-source").hidden, "Verified binary payload enables source extraction");
      const recoveredFile = element("decoded-attachments").querySelector("a");
      const downloadedBytes = new app.Uint8Array(await (await fetch(recoveredFile.href)).arrayBuffer());
      check(downloadedBytes.length === 256 && downloadedBytes.every((byte, i) => byte === i), "Recovered-file download contains exact original bytes");
      await openExport(element("download"));
      check(element("export-name").value === "public-photo-pixelstow.png" && doc.activeElement === element("export-name") && element("file").disabled, "PNG export opens a focused filename dialog with a suggested name and freezes image import");
      const beforeCancel = downloads.length;
      element("export-cancel").click();
      await until(() => !element("decode").disabled, "cancelled export");
      check(downloads.length === beforeCancel && !element("download").hidden && element("readout").value === payload.text, "Cancelling export downloads nothing and preserves the verified result");
      await openExport(element("download"));
      input("export-name", "../birthday.png"); element("export-form").requestSubmit();
      check(element("export-dialog").open && !element("export-error").hidden && downloads.length === beforeCancel, "The filename dialog rejects paths without starting a download");
      input("export-name", "Birthday card 🎂");
      check(element("export-preview").textContent === "Save as: Birthday card 🎂.png", "The filename preview clearly shows the export extension when omitted");
      const namedPng = await saveExport("Birthday card 🎂");
      const originalPngBytes = new app.Uint8Array(await encodedPng.arrayBuffer());
      check(namedPng.name === "Birthday card 🎂.png" && namedPng.bytes.length === originalPngBytes.length && namedPng.bytes.every((byte, i) => byte === originalPngBytes[i]), "Renaming an encoded PNG preserves its verified bytes exactly");
      await openExport(element("save-message"));
      const namedMessage = await saveExport("Birthday message.txt");
      check(namedMessage.name === "Birthday message.txt" && new app.TextDecoder().decode(namedMessage.bytes) === payload.text, "Message export uses the chosen filename and preserves the complete UTF-8 message");
      await openExport(recoveredFile);
      check(element("export-name").value === payload.attachments[0].name, "Attachment export suggests the original embedded filename");
      const namedFile = await saveExport("renamed attachment");
      check(namedFile.name === "renamed attachment.bin" && namedFile.bytes.length === 256 && namedFile.bytes.every((byte, i) => byte === i), "Attachment export renames the download without changing its binary contents");
      await openExport(element("save-source"));
      const namedSource = await saveExport("Recovered photo");
      const sourcePng = await app.PixelStow.decodePng(namedSource.bytes);
      const expectedCarrier = await app.PixelStow.extractCarrier(decodedPng.pixels, width, height, payload.strength);
      check(namedSource.name === "Recovered photo.png" && sourcePng.pixels.every((byte, i) => byte === expectedCarrier[i]), "Source PNG export asks for a filename and writes the recovered source pixels");
      await openExport(element("save-source-jpeg"));
      const namedSourceJpeg = await saveExport("Recovered photo JPEG");
      const sourceJpeg = await app.PixelStow.readImageFile(new app.File([namedSourceJpeg.bytes], namedSourceJpeg.name, { type: "image/jpeg" }));
      check(namedSourceJpeg.name === "Recovered photo JPEG.jpg" && sourceJpeg.width === width && sourceJpeg.height === height && !(await app.PixelStow.inspect(sourceJpeg.pixels, width, height)).found, "Source JPEG export uses the chosen filename and contains a clean source image");
      check(!element("save-encoded-jpeg").hidden, "The public test carrier produces a verified JPEG export");
      await openExport(element("save-encoded-jpeg"));
      const namedJpeg = await saveExport("Birthday JPEG.jpg");
      const jpegImage = await app.PixelStow.readImageFile(new app.File([namedJpeg.bytes], namedJpeg.name, { type: "image/jpeg" }));
      check(namedJpeg.name === "Birthday JPEG.jpg" && app.PixelStow.payloadsEqual(await app.PixelStow.decode(jpegImage.pixels, width, height, publicPassword), payload), "Encoded JPEG export uses the chosen filename and still recovers the entire locked payload");
      element("relock").click();
      check(!element("readout").value && element("decoded-files").hidden && element("save-source").hidden && !element("attachment-list").children.length, "Lock again removes plaintext, attachments, players and source extraction");
      check(!element("unlock-form").hidden && element("decoded-content").hidden && element("encoding-passwords").hidden && element("decode").hidden, "Relocking replaces contents with one password field and a dedicated Unlock button");
      input("unlock-password", "incorrect"); element("unlock").click();
      await until(() => !element("unlock").disabled, "wrong-password result");
      check(element("status").textContent.includes("incorrect") && element("decoded-files").hidden, "Wrong password reveals no recovered file metadata");
      check(!element("unlock-form").hidden && !element("contents-summary").textContent, "Incorrect password leaves the unlock prompt visible and the contents summary empty");
      input("unlock-password", publicPassword); element("unlock-form").requestSubmit();
      await until(() => !element("unlock").disabled || !element("decoded-files").hidden, "result unlock");
      check(element("readout").value === payload.text, "An encoded result can be unlocked independently of its original clean carrier");
      check(element("unlock-form").hidden && !element("decoded-content").hidden && !element("unlock-password").value, "Submitting the unlock form replaces the prompt with contents and clears the password");
      const play = app.HTMLMediaElement.prototype.play;
      app.HTMLMediaElement.prototype.play = function () { return Promise.reject(new app.DOMException("Test autoplay blocked", "NotAllowedError")); };
      files("file", [new app.File([encodedPng], "birthday-card.png", { type: "image/png" })]);
      await until(() => !element("decode").disabled, "independent locked import");
      check(element("decoded-files").hidden && element("encode").disabled && element("attachment-file").disabled, "Locked import disables re-encoding without exposing files");
      check(!element("payload-panel").hidden && !element("unlock-form").hidden && element("unlock-prompt").textContent.includes("password") && element("preview").nextElementSibling === element("payload-panel"), "The image preview comes first, followed immediately by the prominent password or contents panel");
      check(element("composition").hidden && element("unlock-form").querySelectorAll('input[type="password"]').length === 1, "An imported locked image offers exactly one visible password input");
      input("unlock-password", publicPassword); element("unlock").click();
      await until(() => !element("decode").disabled && element("decoded-attachments").children.length === 3, "independent unlock");
      await until(() => element("decoded-attachments").textContent.includes("Press Play"), "autoplay fallback");
      check(element("decoded-attachments").textContent.includes("Press Play"), "Autoplay refusal gives a visible Play fallback");
      check(element("unlock-form").hidden && !element("decoded-content").hidden && element("composition").hidden, "Imported contents replace the password prompt while encoding controls remain hidden");
      app.HTMLMediaElement.prototype.play = play;
      files("file", [clean]);
      await until(() => !element("encode").disabled, "new clean carrier");
      check(element("decoded-files").hidden && !element("readout").value && !element("attachment-list").children.length, "New image clears previous text, recovered files and composition");
      check(element("payload-panel").hidden && !element("encoding-passwords").hidden, "A new clean carrier restores the encoding password and confirmation");
      const pastedImage = new app.DataTransfer();
      pastedImage.items.add(clean);
      doc.dispatchEvent(new app.ClipboardEvent("paste", { bubbles: true, cancelable: true, clipboardData: pastedImage }));
      await until(() => !element("encode").disabled && element("loaded-image").textContent === "Pasted from clipboard", "clipboard image import");
      check(element("loaded-image").textContent === "Pasted from clipboard", "Pasting an image shows its clipboard origin instead of a synthetic filename");
      audioContext = new app.AudioContext();
      const discardStream = audioContext.createMediaStreamDestination().stream;
      Object.defineProperty(app.navigator.mediaDevices, "getUserMedia", { configurable: true, value: async () => discardStream });
      element("record-audio").click();
      await until(() => !element("stop-audio").hidden, "discard recording start");
      element("cancel-audio").click();
      await until(() => !element("encode").disabled, "discard recording end");
      check(!element("attachment-list").children.length && discardStream.getTracks().every((track) => track.readyState === "ended"), "Discarding a recording attaches nothing and releases the audio tracks");
      await audioContext.close(); audioContext = null;
      let resolveMicrophone;
      Object.defineProperty(app.navigator.mediaDevices, "getUserMedia", {
        configurable: true, value: () => new Promise((resolve) => { resolveMicrophone = resolve; })
      });
      element("record-audio").click();
      await until(() => !element("cancel-audio").hidden, "pending microphone request");
      element("cancel-audio").click();
      check(!element("encode").disabled && !element("file").disabled, "A pending microphone request can be cancelled without freezing the page");
      audioContext = new app.AudioContext();
      const lateStream = audioContext.createMediaStreamDestination().stream;
      resolveMicrophone(lateStream);
      await until(() => lateStream.getTracks().every((track) => track.readyState === "ended"), "late microphone cleanup");
      check(!element("attachment-list").children.length && element("stop-audio").hidden, "Late microphone permission releases the unused stream after cancellation");
      await audioContext.close(); audioContext = null;
      Object.defineProperty(app.navigator.mediaDevices, "getUserMedia", {
        configurable: true, value: async () => { throw new app.DOMException("Test denied", "NotAllowedError"); }
      });
      element("record-audio").click();
      await until(() => !element("encode").disabled, "permission denial");
      check(element("status").textContent.includes("denied") && element("stop-audio").hidden, "Microphone denial restores responsive controls with an explanation");
      files("attachment-file", [new app.File([binary], "binary-only.bin")]);
      await until(() => element("attachment-list").children.length === 1 && !element("encode").disabled, "binary-only attachment");
      element("encode").click();
      await until(() => !element("download").hidden && !element("decode").disabled, "binary-only encode");
      check(!element("readout").value && !element("save-source").hidden && !element("decoded-files").hidden, "Binary-only payload works without text and still supports source extraction");
      check(element("decoded-message").hidden && element("contents-summary").textContent === "This image contains 1 attached file.", "Binary-only contents show a clear file summary without an empty message box");
      await openExport(element("download"));
      check(element("export-name").value === "clipboard-image-pixelstow.png", "Clipboard image exports start with a useful clipboard-based filename");
      element("export-cancel").click();
      await until(() => !element("decode").disabled, "cancelled clipboard export");
      files("file", [clean]);
      await until(() => !element("encode").disabled, "automatic-stop carrier");
      check(element("loaded-image").textContent === "Loaded file: public-photo.png", "Loading a file after a paste replaces the clipboard label with its filename");
      audioContext = new app.AudioContext();
      await audioContext.resume();
      const autoOscillator = audioContext.createOscillator();
      const autoDestination = audioContext.createMediaStreamDestination();
      autoOscillator.connect(autoDestination); autoOscillator.start();
      Object.defineProperty(app.navigator.mediaDevices, "getUserMedia", { configurable: true, value: async () => autoDestination.stream });
      element("record-audio").click();
      await until(() => !element("stop-audio").hidden, "automatic recording start");
      await until(() => !element("encode").disabled && element("attachment-list").children.length === 1, "automatic byte-budget stop", 35000);
      check(autoDestination.stream.getTracks().every((track) => track.readyState === "ended"), "Recording automatically stops near the photo budget and releases the stream");
      autoOscillator.stop(); await audioContext.close(); audioContext = null;
      results.textContent += "ALL BROWSER CHECKS PASSED.\n";
    } catch (error) {
      results.textContent += "FAIL: " + (error.stack || error.message) + "\n";
    } finally {
      if (restoreDownloads) restoreDownloads();
      if (audioContext) await audioContext.close();
      run.disabled = false;
    }
  });
</script>
</html>
