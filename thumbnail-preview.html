<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TileStorm Thumbnail Preview</title>
  <link rel="canonical" href="https://www.massivehadron.com/thumbnail-preview.html">
  <style>
    :root {
      color-scheme: dark;
      --bg: #081016;
      --panel: #121923;
      --text: #f2f6fb;
      --muted: #a8b7c8;
      --border: #2a394a;
      --tile-azure: #8cebed;
      --tile-community: #f5e69e;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    }

    .video-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: url("./web_portal_background.png") center top / cover no-repeat;
    }

    .video-backdrop video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.74) saturate(1.04);
    }

    .video-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 12, 18, 0.48), rgba(7, 12, 18, 0.84));
    }

    @media (prefers-reduced-motion: reduce) {
      .video-backdrop video {
        display: none;
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      max-width: 1040px;
      margin: 6vh auto;
      padding: 28px;
    }

    .card {
      background: rgba(18, 25, 35, 0.92);
      backdrop-filter: blur(10px) saturate(1.08);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
    }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: var(--tile-community);
      font-size: clamp(1.7rem, 4vw, 2.8rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    a {
      color: var(--tile-azure);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(140, 235, 237, 0.55);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(140, 235, 237, 0.22), rgba(245, 230, 158, 0.16));
      color: var(--text);
      font-weight: 700;
    }

    .button-link:hover {
      filter: brightness(1.08);
      text-decoration: none;
    }

    .preview-frame {
      display: grid;
      place-items: center;
      min-height: min(62vh, 620px);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(3, 8, 13, 0.72);
      overflow: auto;
    }

    .preview-frame img {
      width: min(100%, 720px);
      height: auto;
      image-rendering: auto;
      border-radius: 10px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
    }

    .error {
      color: #ffc5c5;
    }

    @media (max-width: 620px) {
      .wrap {
        margin: 0;
        padding: 14px;
      }

      .card {
        padding: 22px;
      }

      .preview-frame {
        min-height: 44vh;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="video-backdrop" aria-hidden="true">
    <video autoplay muted loop playsinline poster="./web_portal_background.png">
      <source src="./preview.webm" type="video/webm">
      <source src="./preview.mkv" type="video/x-matroska">
    </video>
  </div>
  <main class="wrap">
    <section class="card">
      <div class="masthead">
        <h1 id="title">Thumbnail Preview</h1>
        <a class="button-link" href="./">Back to maps</a>
      </div>
      <p id="status">Loading thumbnail...</p>
      <div class="actions" id="actions" hidden>
        <a class="button-link" id="rawLink" href="#">Open raw PNG</a>
        <a class="button-link" id="downloadLink" href="#" download>Download PNG</a>
      </div>
      <div class="preview-frame" id="previewFrame"></div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";
    const name = params.get("name") || "thumbnail.png";
    const titleEl = document.getElementById("title");
    const statusEl = document.getElementById("status");
    const actionsEl = document.getElementById("actions");
    const rawLinkEl = document.getElementById("rawLink");
    const downloadLinkEl = document.getElementById("downloadLink");
    const previewFrameEl = document.getElementById("previewFrame");

    function isSafeThumbnailPath(path) {
      return /^thumbs\/[A-Za-z0-9._% -]+\.png$/i.test(path) && !path.includes("..");
    }

    if (!file || !isSafeThumbnailPath(file)) {
      statusEl.innerHTML = '<span class="error">No valid thumbnail was supplied.</span>';
    } else {
      titleEl.textContent = name.replace(/\.png$/i, "") + " thumbnail";
      rawLinkEl.href = file;
      downloadLinkEl.href = file;
      downloadLinkEl.download = name;
      actionsEl.hidden = false;

      const image = new Image();
      image.alt = name;
      image.onload = () => {
        statusEl.textContent = "Preview is enlarged for inspection. Use the buttons above for the original PNG.";
      };
      image.onerror = () => {
        statusEl.innerHTML = '<span class="error">The thumbnail image could not be loaded.</span>';
      };
      image.src = file;
      previewFrameEl.appendChild(image);
    }
  </script>
</body>
</html>
